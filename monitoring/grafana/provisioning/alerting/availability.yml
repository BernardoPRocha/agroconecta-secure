apiVersion: 1
groups:
  - orgId: 1
    name: Disponibilidade AgroConecta
    folder: AgroConecta
    interval: 15s
    rules:
      - uid: agroconecta-down
        title: AgroConecta indisponível
        condition: B
        for: 30s
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: A aplicação deixou de responder ao Prometheus.
          description: Verifique app e rede; ausência de dados também dispara este alerta.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: agro-prom
            relativeTimeRange:
              from: 60
              to: 0
            model:
              refId: A
              expr: 'up{job="agroconecta-azure-prod"}'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
                    params: []
                  type: query
                  query:
                    params: [B]
